productName: VPN4TV
copyright: nekohasekai
publish: null
afterPack: scripts/afterPack.cjs
afterSign: scripts/afterSign.cjs
artifactBuildStarted: scripts/artifactBuildStarted.cjs
artifactBuildCompleted: scripts/artifactBuildCompleted.cjs
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
toolsets:
  nsis: "1.2.1"
directories:
  buildResources: build
  output: release
files:
  - out/**
  - "!**/*.map"
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
  - fa
  - ru
extraResources:
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: dashboard/public/licenses/NotoColorEmoji-OFL.txt
    to: licenses/NotoColorEmoji-OFL.txt
  - from: resources/icons/512x512.png
    to: icons/512x512.png
fileAssociations:
  - ext: bpf
    name: sing-box profile
    description: sing-box profile
    mimeType: application/x-sing-box-profile
# VPN4TV: the Electron client for macOS. The native SwiftUI client remains the
# better fit there, but this ships the same feature set without an Apple
# Developer ID.
mac:
  appId: com.vpn4tv.desktop
  category: public.app-category.utilities
  icon: resources/icon.icns
  darkModeSupport: true
  # macOS only opens schemes that the bundle declares; setAsDefaultProtocolClient
  # at runtime is not enough on its own.
  protocols:
    - name: sing-box
      schemes:
        - sing-box
    - name: VPN4TV server key
      schemes:
        - vpn4tv
        - vless
        - vmess
        - trojan
        - ss
        - hysteria2
        - hy2
        - tuic
  # Notarisation requires the hardened runtime; the entitlements cover Electron's JIT.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # The daemon is not inside the app's code, so it has to be signed explicitly.
  binaries:
    - Contents/Resources/daemon/sing-box-daemon
  extraResources:
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: bin/sing-box-daemon
      to: daemon/sing-box-daemon
  target:
    - dmg
  artifactName: VPN4TV-macOS-${version}-${arch}.${ext}
dmg:
  artifactName: VPN4TV-macOS-${version}-${arch}.${ext}
  title: VPN4TV
win:
  appId: com.vpn4tv.desktop
  forceCodeSigning: true
  icon: resources/icon.ico
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
  extraResources:
    - from: resources/tray.ico
      to: tray.ico
    - from: bin/windows/${arch}/sing-box-daemon.exe
      to: daemon/sing-box-daemon.exe
    - from: bin/windows/${arch}
      to: daemon
      filter:
        - libcronet.dll
  target:
    - nsis
  artifactName: VPN4TV-Windows-${version}-${arch}.${ext}
nsis:
  oneClick: false
  buildUniversalInstaller: false
  differentialPackage: false
  installerLanguages:
    - en_US
    - zh_CN
    - zh_TW
    - ru_RU
  license: LICENSE
  perMachine: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: VPN4TV-Windows-${version}-${arch}.${ext}
linux:
  appId: com.vpn4tv.desktop
  syncDesktopName: true
  executableName: vpn4tv
  icon: resources/icons
  synopsis: VPN for Android TV, desktop and mobile
  category: Network
  maintainer: VPN4TV <support@vpn4tv.com>
  vendor: VPN4TV
  protocols:
    - name: sing-box
      schemes:
        - sing-box
    # VPN4TV: server keys open in the app, as on Android.
    - name: VPN4TV server key
      schemes:
        - vless
        - vmess
        - trojan
        - ss
        - hysteria2
        - hy2
        - tuic
        - vpn4tv
  extraResources:
    - from: resources/tray.png
      to: tray.png
    - from: resources/tray@2x.png
      to: tray@2x.png
    - from: bin/sing-box-daemon
      to: daemon/sing-box-daemon
  desktop:
    entry:
      StartupWMClass: vpn4tv
  target:
    - deb
    - rpm
    - pacman
  artifactName: VPN4TV-Linux-${version}-${arch}.${ext}
deb:
  packageCategory: net
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
  compression: xz
  fpm:
    - --depends=pkexec
    - --deb-compression-level=9
    - --before-remove=build/linux-before-remove.sh
    - build/sing-box-daemon.service=/usr/lib/systemd/system/sing-box-daemon.service
    - build/io.nekohasekai.sfl.policy=/usr/share/polkit-1/actions/io.nekohasekai.sfl.policy
    - build/io.nekohasekai.sfl.metainfo.xml=/usr/share/metainfo/io.nekohasekai.sfl.metainfo.xml
rpm:
  packageCategory: Applications/Internet
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
  compression: xzmt
  fpm:
    - --depends=polkit
    - --rpm-compression-level=9
    - --rpm-rpmbuild-define=_buildhost reproducible
    - --rpm-rpmbuild-define=use_source_date_epoch_as_buildtime 1
    - --rpm-rpmbuild-define=clamp_mtime_to_source_date_epoch 1
    - --before-remove=build/linux-before-remove.sh
    - build/sing-box-daemon.service=/usr/lib/systemd/system/sing-box-daemon.service
    - build/io.nekohasekai.sfl.policy=/usr/share/polkit-1/actions/io.nekohasekai.sfl.policy
    - build/io.nekohasekai.sfl.metainfo.xml=/usr/share/metainfo/io.nekohasekai.sfl.metainfo.xml
pacman:
  artifactName: VPN4TV-Linux-${version}-${arch}.pkg.tar.zst
  packageCategory: network
  afterInstall: build/linux-after-install-pacman.sh
  afterRemove: build/linux-after-remove-pacman.sh
  compression: zstd
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify
    - libappindicator-gtk3
    - polkit
  fpm:
    - --description=Linux client for sing-box, The universal proxy platform
    - --before-remove=build/linux-before-remove-pacman.sh
    - --after-upgrade=build/linux-after-install-pacman.sh
    - build/sing-box-daemon.service=/usr/lib/systemd/system/sing-box-daemon.service
    - build/io.nekohasekai.sfl.policy=/usr/share/polkit-1/actions/io.nekohasekai.sfl.policy
    - build/io.nekohasekai.sfl.metainfo.xml=/usr/share/metainfo/io.nekohasekai.sfl.metainfo.xml
